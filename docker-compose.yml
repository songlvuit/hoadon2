services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: xuat-hoa-don:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Chỉ mở cho máy chủ; Nginx/Cloudflare phía trước trỏ vào cổng này
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - app_files:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hoadon}
      POSTGRES_USER: ${DB_USERNAME:-hoadon}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hoadon} -d ${DB_DATABASE:-hoadon}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  app_files:
  app_logs:
